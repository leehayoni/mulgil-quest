async function foeTurn(f){

 const reach=reachable(f);let best=null;
 for(const v of reach.values()){if(v.occupied)continue;for(const h of cands){const d=Math.abs(v.c-h.c)+Math.abs(v.r-h.r);if(d<f.rng[0]||d>f.rng[1])continue;
  const dmg=calcDmg(f,h,v.c,v.r);const sc=dmg+(dmg>=h.hp?25:0)-v.d*.1+(f.rng[1]>1?d*1.5:0)-h.hp*.05;if(!best||sc>best.sc)best={v,h,sc}}}
 GS.focus=f;
 if(best){if(best.v.c!==f.c||best.v.r!==f.r)await moveAlong(f,pathTo(reach,key(best.v.c,best.v.r)));await sleep(.1);await strike(f,best.h)}
 else{
  let tgt=taunter;if(!tgt){let bd=1e9;for(const h of hs){const d=dist(h,f);if(d<bd){bd=d;tgt=h}}}
  const field=distField(tgt,f.jump);let bv=null,bs=field.get(key(f.c,f.r))??1e9;
  for(const v of reach.values()){if(v.occupied)continue;const s=field.get(key(v.c,v.r));if(s!=null&&s<bs){bs=s;bv=v}}
  if(bv)await moveAlong(f,pathTo(reach,key(bv.c,bv.r)));
 }
 await sleep(.12);
 checkEnd();
}

function checkEnd(){

 if((st.goal==='rout'||(st.goal==='survive'&&!(st.reinforce||[]).some(rf=>rf.turn>GS.turn)))&&!foes().length){win();return true}
 if(st.goal==='boss'&&!GS.units.some(u=>u.boss&&u.alive)){win();return true}
 if(st.goal==='goal'&&heroes().some(h=>h.c===st.goalAt[0]&&h.r===st.goalAt[1])){win();return true}
 return false;
}

}
cv.addEventListener('pointerdown',e=>{ac();ptr={id:e.pointerId,x:e.clientX,y:e.clientY,sx:e.clientX,sy:e.clientY,pan:false};try{cv.setPointerCapture(e.pointerId)}catch(err){}});
cv.addEventListener('pointermove',e=>{if(!ptr||e.pointerId!==ptr.id||!GS)return;const dx=e.clientX-ptr.x,dy=e.clientY-ptr.y;ptr.x=e.clientX;ptr.y=e.clientY;if(!ptr.pan&&Math.hypot(e.clientX-ptr.sx,e.clientY-ptr.sy)>9)ptr.pan=true;if(ptr.pan&&!GS.title){cam.x+=dx;cam.y+=dy;clampCam()}});
cv.addEventListener('pointerup',e=>{if(!ptr||e.pointerId!==ptr.id)return;const wasPan=ptr.pan;ptr=null;if(!wasPan&&GS&&MODE==='battle'&&$('dlg').classList.contains('hide'))onTap(pickTile(e.clientX,e.clientY))});
cv.addEventListener('pointercancel',()=>ptr=null);
cv.addEventListener('wheel',e=>{if(!GS||GS.title)return;e.preventDefault();const f=e.deltaY<0?1.1:1/1.1;const nt=clamp(TW*f,40,140),r=nt/TW;cam.x=e.clientX-(e.clientX-cam.x)*r;cam.y=e.clientY-(e.clientY-cam.y)*r;TW=nt;TH=TW/2;HZ=TW*.3;const n=GS.cols+GS.rows;GS.bounds={minX:-GS.rows*TW/2,maxX:GS.cols*TW/2,minY:-GS.maxH*HZ-TW*1.15,maxY:n*TH/2+HZ*.6};clampCam()},{passive:false});
cv.addEventListener('contextmenu',e=>e.preventDefault());

/* ---------------- loop ---------------- */
let last=performance.now();
function loop(now){const dt=Math.min(.05,(now-last)/1000);last=now;T+=dt;stepTweens(dt);render();requestAnimationFrame(loop)}
resize();makePatterns();toTitle();requestAnimationFrame(loop);
</script>
</body>
</html>
