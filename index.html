 for(let r=0;r<rows;r++)for(let c=0;c<cols;c++){const ch=st.t[r][c],h=st.h?+st.h[r][c]:((ch==='w'||ch==='x')?0:1);const R=mulberry32(hashStr(c+'_'+r+st.name));
  const t={c,r,ty:ch,h,tufts:[]};
  if(ch==='w'||ch==='x')t.h=0;if(ch==='b')t.h=1;
  t.block=ch==='t'||ch==='k'||ch==='r'||ch==='w'||ch==='x'||ch==='m';
  if((ch==='g'||ch==='t'||ch==='k'||ch==='e'||ch==='m')&&!st.snow){const n=2+Math.floor(R()*3);for(let i=0;i<n;i++)t.tufts.push([R()*.7-.35,R()*.7-.35,R()])}

  maxH=Math.max(maxH,t.h+(ch==='r'?1.4:0));tiles.push(t)}

}

  else{const gr=ctx.createRadialGradient(x,y,0,x,y,TW*.18);gr.addColorStop(0,'rgba(255,255,230,1)');gr.addColorStop(.4,p.gold?'rgba(255,220,120,.95)':p.pink?'rgba(255,150,240,.9)':p.dark?'rgba(170,80,255,.9)':'rgba(140,255,230,.9)');gr.addColorStop(1,p.gold?'rgba(255,200,80,0)':p.pink?'rgba(255,120,230,0)':p.dark?'rgba(120,40,220,0)':'rgba(140,255,230,0)');ctx.fillStyle=gr;ctx.beginPath();ctx.arc(x,y,TW*.18,0,7);ctx.fill()}}

/* ---------------- tweens ---------------- */
const tweens=[];
function tween(dur,fn){return new Promise(res=>tweens.push({t:0,dur,fn,res}))}
const sleep=s=>tween(s,()=>{});
function stepTweens(dt){for(let i=tweens.length-1;i>=0;i--){const w=tweens[i];w.t+=dt;const k=Math.min(1,w.t/w.dur);w.fn(k);if(k>=1){tweens.splice(i,1);w.res()}}}
function popup(u,text,col,big){const p=iso(u.c,u.r,H(u.c,u.r));const o={x:p.x,y:p.y,text,col,big,k:0};GS.popups.push(o);tween(1.1,k=>o.k=k).then(()=>{const i=GS.popups.indexOf(o);if(i>=0)GS.popups.splice(i,1)})}
function fx(u,kind,col,dur){const p=iso(u.c,u.r,H(u.c,u.r));const o={x:p.x,y:p.y,kind,col,k:0};GS.fx.push(o);return tween(dur||.5,k=>o.k=k).then(()=>{const i=GS.fx.indexOf(o);if(i>=0)GS.fx.splice(i,1)})}

/* ---------------- sound ---------------- */
let AC=null;function ac(){if(!AC){try{AC=new(window.AudioContext||window.webkitAudioContext)()}catch(e){}}if(AC&&AC.state==='suspended')AC.resume().catch(()=>{});return AC}
function blip(f0,f1,d,v,type){const a=ac();if(!a)return;const t=a.currentTime,o=a.createOscillator(),g=a.createGain();o.type=type||'square';o.frequency.setValueAtTime(f0,t);o.frequency.exponentialRampToValueAtTime(f1,t+d);g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.001,t+d);o.connect(g);g.connect(a.destination);o.start(t);o.stop(t+d+.02)}
const SFX={hit:()=>blip(320,90,.14,.13),crit:()=>{blip(600,120,.2,.15);blip(900,200,.15,.08,'sawtooth')},heal:()=>{blip(520,880,.18,.08,'triangle');setTimeout(()=>blip(780,1200,.18,.07,'triangle'),90)},step:()=>blip(180,140,.04,.03,'triangle'),sel:()=>blip(700,900,.05,.05,'triangle'),die:()=>blip(300,60,.35,.1,'sawtooth')};

/* ---------------- movement / rules ---------------- */
function reachable(u){
 const res=new Map(),q=[[u.c,u.r,0]];res.set(key(u.c,u.r),{c:u.c,r:u.r,d:0,prev:null});
 while(q.length){const[c,r,d]=q.shift();if(d>=u.mov)continue;
  for(const[dc,dr]of DIRS){const nc=c+dc,nr=r+dr,t=GS.T(nc,nr);if(!pass(t))continue;const dh=t.h-H(c,r);if(dh>u.jump||-dh>u.jump+1)continue;
   const o=unitAt(nc,nr);if(o&&o.team!==u.team)continue;const kk=key(nc,nr);if(res.has(kk))continue;res.set(kk,{c:nc,r:nr,d:d+1,prev:key(c,r)});q.push([nc,nr,d+1])}}
 for(const v of res.values()){const o=unitAt(v.c,v.r);v.occupied=!!(o&&o!==u)}
 return res;
}
function pathTo(reach,k){const p=[];let v=reach.get(k);while(v){p.unshift(v);v=v.prev?reach.get(v.prev):null}return p}
function distField(tgt,jump){const f=new Map(),q=[[tgt.c,tgt.r]];f.set(key(tgt.c,tgt.r),0);
 while(q.length){const[c,r]=q.shift(),d=f.get(key(c,r));for(const[dc,dr]of DIRS){const nc=c+dc,nr=r+dr,t=GS.T(nc,nr);if(!pass(t))continue;const dh=H(c,r)-t.h;if(dh>jump||-dh>jump+1)continue;const kk=key(nc,nr);if(f.has(kk))continue;f.set(kk,d+1);q.push([nc,nr])}}return f}
function setFace(u,tc,tr){const dc=tc-u.c,dr=tr-u.r,sx=dc-dr,sy=dc+dr;if(sx>0)u.dir=1;else if(sx<0)u.dir=-1;if(sy!==0)u.back=sy<0}
async function moveAlong(u,path){
 for(let i=1;i<path.length;i++){const a=path[i-1],b=path[i];setFace(u,b.c,b.r);u.c=b.c;u.r=b.r;const h0=H(a.c,a.r),h1=H(b.c,b.r);SFX.step();
  await tween(.15,k=>{u.vc=lerp(a.c,b.c,k);u.vr=lerp(a.r,b.r,k);u.vh=lerp(h0,h1,k);u.hop=Math.sin(k*Math.PI)*(h1!==h0?1:.25);u.walk+=.016})}
 u.hop=0;u.walk=0;u.vc=u.c;u.vr=u.r;u.vh=H(u.c,u.r);
}
function calcDmg(a,d,ac_,ar){const dh=H(ac_??a.c,ar??a.r)-H(d.c,d.r);const mult=(1+(dh>0?.25:dh<0?-.15:0))*(a.buff?1.4:1);const def=(d.def+(d.defBuff||0))*(d.armorBreak?.5:1)*(a.mag?.25:.5);return Math.max(1,Math.round(a.atk*mult-def))}
async function strike(a,d,mult){
 setFace(a,d.c,d.r);
 const ranged=(dist(a,d)>1&&a.k!=='bambi')||a.mag;
 if(ranged){a.pose=a.mag?'cast':'atk';const p0=iso(a.c,a.r,H(a.c,a.r)),p1=iso(d.c,d.r,H(d.c,d.r));const pr={x0:p0.x,y0:p0.y-TW*.55,x1:p1.x,y1:p1.y-TW*.45,k:0,kind:a.mag?'orb':'arrow',arc:a.mag?.15:.35,dark:a.mag&&a.k!=='sea'&&a.k!=='anton'&&a.k!=='ttori',pink:a.k==='ttori',gold:a.k==='anton'};GS.proj.push(pr);await tween(.32,k=>pr.k=k);GS.proj.splice(GS.proj.indexOf(pr),1)}
 else{a.pose='atk';const dc=d.c-a.c,dr=d.r-a.r,sx=(dc-dr),sy=(dc+dr);await tween(.12,k=>{a.lx=sx*k*.5;a.ly=sy*k*.5});fx(d,'slash','#fff',.25)}
 let dmg=Math.round(calcDmg(a,d)*(mult||1));const crit=Math.random()<.1;if(crit)dmg=Math.round(dmg*1.5);
 d.hp=Math.max(0,d.hp-dmg);d.shake=1;crit?SFX.crit():SFX.hit();
 popup(d,(crit?'치명 ':'')+dmg,crit?'#ffd23a':'#fff',crit);
 tween(.3,k=>d.shake=1-k);
 if(!ranged)await tween(.12,k=>{a.lx*=.6;a.ly*=.6});a.lx=a.ly=0;
 await sleep(.15);a.pose='idle';
 if(d.hp<=0)await kill(d);
}
async function kill(u){u.alive=false;SFX.die();if(u.team==='hero')GS.deaths++;popup(u,u.team==='hero'?'쓰러짐':'',u.team==='hero'?'#ff8a8a':'#fff');await tween(.45,k=>{u.fade=1-k})}

function targetsFor(u,kind){
 if(kind==='heal')return heroes().filter(h=>dist(h,u)<=2&&h.hp<h.maxhp);
 if(kind==='aoe')return foes().filter(f=>{const d=dist(f,u);return d>=1&&d<=3});
 if(kind==='stun')return foes().filter(f=>{const d=dist(f,u);return d>=1&&d<=3&&!f.stun});
 if(kind==='spin'||kind==='double'||kind==='scratch')return foes().filter(f=>dist(f,u)===1);
 if(kind==='pierce')return foes().filter(f=>{const d=dist(f,u);return d>=1&&d<=2&&(f.c===u.c||f.r===u.r)});
 return foes().filter(f=>{const d=dist(f,u);return d>=u.rng[0]&&d<=u.rng[1]});
}
function skillOK(u){if(u.cd>0)return false;if(u.k==='lian')return targetsFor(u,'spin').length>0;if(u.k==='sea')return targetsFor(u,'heal').length>0;if(u.k==='eunseok')return targetsFor(u,'aoe').length>0;if(u.k==='ttori')return targetsFor(u,'stun').length>0;if(u.k==='taro')return targetsFor(u,'double').length>0;if(u.k==='bambi')return targetsFor(u,'pierce').length>0;if(u.k==='binnyang')return targetsFor(u,'scratch').length>0;return true}

function focusUnit(u,force){const p=iso(u.c,u.r,H(u.c,u.r));const x=p.x+cam.x,y=p.y+cam.y;const mx=SW*.18,my=SH*.22;if(!force&&x>mx&&x<SW-mx&&y>my&&y<SH-my)return Promise.resolve();

 if(GS.mode==='target'&&sx!=null){let tg=t?GS.targets.find(x=>x.c===t.c&&x.r===t.r):null;if(!tg)tg=nearestOf(GS.targets,sx,sy,TW*.95);if(tg){await execTarget(tg);return}}
 if(GS.mode==='target'){const tg=t?GS.targets.find(x=>x.c===t.c&&x.r===t.r):null;if(tg){await execTarget(tg)}else{GS.mode='move';refresh();if(u)showInfo(u)}return}

 if(GS.st.reinforce)for(const rf of GS.st.reinforce)if(rf.turn===GS.turn){let n=0;for(const[k,c,r]of rf.foes){if(unitAt(c,r))continue;const u=mkUnit('foe',k,c,r,GS.si);u.vh=H(c,r);u.fade=0;GS.units.push(u);tween(.5,q=>u.fade=q);n++}if(n)await banner('적 증원!',true)}

async function foeTurn(f){
 if(!f.alive)return;
 if(f.stun>0){f.stun--;GS.focus=f;popup(f,'쿨쿨…','#e0d0ff');await sleep(.45);return}
 const hs=heroes();if(!hs.length)return;
 if(f.boss&&!hs.some(h=>dist(h,f)<=5))return;
 const taunter=hs.find(h=>h.taunt&&dist(h,f)<=6);
 const cands=taunter?[taunter]:hs;
 const reach=reachable(f);let best=null;
 for(const v of reach.values()){if(v.occupied)continue;for(const h of cands){const d=Math.abs(v.c-h.c)+Math.abs(v.r-h.r);if(d<f.rng[0]||d>f.rng[1])continue;
  const dmg=calcDmg(f,h,v.c,v.r);const sc=dmg+(dmg>=h.hp?25:0)-v.d*.1+(f.rng[1]>1?d*1.5:0)-h.hp*.05;if(!best||sc>best.sc)best={v,h,sc}}}
 GS.focus=f;await focusUnit(f);
 if(best){if(best.v.c!==f.c||best.v.r!==f.r)await moveAlong(f,pathTo(reach,key(best.v.c,best.v.r)));await sleep(.1);await strike(f,best.h)}
 else{
  let tgt=taunter;if(!tgt){let bd=1e9;for(const h of hs){const d=dist(h,f);if(d<bd){bd=d;tgt=h}}}
  const field=distField(tgt,f.jump);let bv=null,bs=field.get(key(f.c,f.r))??1e9;
  for(const v of reach.values()){if(v.occupied)continue;const s=field.get(key(v.c,v.r));if(s!=null&&s<bs){bs=s;bv=v}}
  if(bv)await moveAlong(f,pathTo(reach,key(bv.c,bv.r)));
 }
 await sleep(.12);
 checkEnd();
}

function checkEnd(){
 if(GS.over)return true;
 if(!heroes().length){lose('모두 쓰러졌다');return true}
 const st=GS.st;
 if((st.goal==='rout'||(st.goal==='survive'&&!(st.reinforce||[]).some(rf=>rf.turn>GS.turn)))&&!foes().length){win();return true}
 if(st.goal==='boss'&&!GS.units.some(u=>u.boss&&u.alive)){win();return true}
 if(st.goal==='goal'&&heroes().some(h=>h.c===st.goalAt[0]&&h.r===st.goalAt[1])){win();return true}
 return false;
}

 for(const u of GS.units){u.vh=H(u.c,u.r)}
 fitMap();$('ui').classList.remove('hide');showInfo(null);GS.phase='intro';refresh();setMsg(meta.explore?st.name:`${si+1}장 · ${st.name}`);
 (async()=>{await sleep(.4);await dialog(st.pre);GS.phase='player';refresh();await banner(`1턴 · 아군 차례`);refresh()})();
}
function toTitle(){
 MODE='title';$('world').classList.add('hide');$('party').innerHTML='';$('ui').classList.add('hide');$('ov').classList.add('hide');$('dlg').classList.add('hide');$('title').classList.remove('hide');
 const st={name:'title',t:["gggtgg","gddddg","gdgggt","tdgggg","gdddgg","ggtggg"],h:["211111","211100","111000","110000","100001","000011"]};
 GS=buildScene(st,true);
 const tpos=[[2,3],[3,2],[3,4],[2,4],[3,3],[4,3],[4,2],[1,3],[4,4]];avail().forEach((k,j)=>{if(tpos[j])GS.units.push(Object.assign(mkUnit('hero',k,tpos[j][0],tpos[j][1],0),{dir:1,back:false}))});
 for(const u of GS.units)u.vh=H(u.c,u.r);
 fitMap();renderTitle();
}
function renderTitle(){
 const tp=$('tParty');tp.innerHTML='';
 for(const m of MEMBERS){const ok=m.ok();const d=document.createElement('div');d.className='pc frame';const c=document.createElement('canvas');c.width=128;c.height=128;d.appendChild(c);
  if(ok)drawPortrait(c,m.k);else{const g=c.getContext('2d');g.fillStyle='rgba(10,8,24,.88)';g.fillRect(0,0,128,128);g.fillStyle='#8a84b8';g.font='900 56px sans-serif';g.textAlign='center';g.textBaseline='middle';g.fillText('?',64,64)}
  d.insertAdjacentHTML('beforeend',ok?`<b>${HERO[m.k].name}</b><small>${HERO[m.k].role.split(' · ')[0]}<br>${HERO[m.k].skill.name}</small>`:`<b>???</b><small>${m.lock}<br>합류</small>`);tp.appendChild(d)}
 if(0){
 const met=!!SV.cleared[4],pe=$('pcE');if(!met){const c=pe.querySelector('canvas'),g=c.getContext('2d');g.setTransform(1,0,0,1,0,0);g.fillStyle='rgba(10,8,24,.88)';g.fillRect(0,0,c.width,c.height);g.fillStyle='#8a84b8';g.font='900 56px sans-serif';g.textAlign='center';g.textBaseline='middle';g.fillText('?',c.width/2,c.height/2)}
 pe.querySelector('b').textContent=met?'은석':'???';pe.querySelector('small').innerHTML=met?'흑마법사<br>암흑구':'5장 클리어 후<br>합류';
 const met2=!!SV.cleared[13],pt=$('pcT');if(!met2){const c=pt.querySelector('canvas'),g=c.getContext('2d');g.setTransform(1,0,0,1,0,0);g.fillStyle='rgba(10,8,24,.88)';g.fillRect(0,0,c.width,c.height);g.fillStyle='#8a84b8';g.font='900 56px sans-serif';g.textAlign='center';g.textBaseline='middle';g.fillText('?',c.width/2,c.height/2)}
 pt.querySelector('b').textContent=met2?'또리':'???';pt.querySelector('small').innerHTML=met2?'보라마법사<br>잘잣!':'14장 클리어 후<br>합류';}
 $('lvl').textContent=`원정대 Lv${heroLv()} · 이야기 ${Object.keys(SV.cleared).length}/${STAGES.length} · 탐험 ${SV.explore||0}회`;
 const box=$('stages');box.innerHTML='';const b=document.createElement('button');b.className='mapbtn';b.textContent=nextMain()===0&&!SV.explore?'모험 시작 ▶':'세계 지도 열기 ▶';b.onclick=()=>{ac();if(nextMain()===0&&!SV.explore)startStage(0);else toWorld()};box.appendChild(b);
}
$('reset').onclick=()=>{$('reset').textContent='정말 지우려면 한 번 더';if($('reset').dataset.c){SV={cleared:{},explore:0};save();$('reset').dataset.c='';$('reset').textContent='진행 기록 지우기';renderTitle()}else $('reset').dataset.c=1};
$('bEnd').onclick=()=>{ac();if(GS&&GS.phase==='player'&&!GS.busy){for(const h of heroes())h.done=true;GS.sel=null;endPlayerTurn()}};
$('bQuit').onclick=()=>{if($('bQuit').dataset.c){$('bQuit').dataset.c='';$('bQuit').textContent='✕';toWorld()}else{$('bQuit').dataset.c=1;$('bQuit').textContent='나가기?';setTimeout(()=>{$('bQuit').dataset.c='';$('bQuit').textContent='✕'},2500)}};

/* ---------------- input ---------------- */
let ptr=null;
function pickTile(sx,sy,tilesOnly){
 const wx=sx-cam.x,wy=sy-cam.y;
 const us=tilesOnly?[]:GS.units.filter(u=>u.alive).sort((a,b)=>(b.c+b.r)-(a.c+a.r));
 for(const u of us){const p=iso(u.c,u.r,H(u.c,u.r));if(Math.abs(wx-p.x)<TW*.28&&wy<p.y+TH*.3&&wy>p.y-TW*(uh(u)-.12))return GS.T(u.c,u.r)}
 const ts=GS.tiles.slice().sort((a,b)=>(b.c+b.r)-(a.c+a.r)||b.c-a.c);
 for(const t of ts){const top=t.ty==='r'?t.h+1.4:hv(t);const p=iso(t.c,t.r,top);if(Math.abs(wx-p.x)/(TW/2)+Math.abs(wy-p.y)/(TH/2)<=1)return t}
 return null;
}
const touches=new Map();let pinch=null;
cv.addEventListener('pointerdown',e=>{ac();touches.set(e.pointerId,{x:e.clientX,y:e.clientY});try{cv.setPointerCapture(e.pointerId)}catch(err){}
 if(touches.size===2&&(MODE==='world'||(GS&&!GS.title))){const[a,b]=[...touches.values()];pinch={d:Math.hypot(a.x-b.x,a.y-b.y)};ptr=null;return}
 if(touches.size===1)ptr={id:e.pointerId,x:e.clientX,y:e.clientY,sx:e.clientX,sy:e.clientY,pan:false}});
cv.addEventListener('pointermove',e=>{if(touches.has(e.pointerId))touches.set(e.pointerId,{x:e.clientX,y:e.clientY});
 if(pinch&&touches.size===2){const[a,b]=[...touches.values()];const d=Math.hypot(a.x-b.x,a.y-b.y);if(d>10){(MODE==='world'?zoomWorld:zoomAt)(d/pinch.d,(a.x+b.x)/2,(a.y+b.y)/2);pinch.d=d}return}
 if(ptr&&e.pointerId===ptr.id&&MODE==='world'){const dx=e.clientX-ptr.x,dy=e.clientY-ptr.y;ptr.x=e.clientX;ptr.y=e.clientY;if(!ptr.pan&&Math.hypot(e.clientX-ptr.sx,e.clientY-ptr.sy)>10)ptr.pan=true;if(ptr.pan){wcam.x+=dx;wcam.y+=dy;clampWorld()}return}
 if(!ptr||e.pointerId!==ptr.id||!GS)return;const dx=e.clientX-ptr.x,dy=e.clientY-ptr.y;ptr.x=e.clientX;ptr.y=e.clientY;if(!ptr.pan&&Math.hypot(e.clientX-ptr.sx,e.clientY-ptr.sy)>12)ptr.pan=true;if(ptr.pan&&!GS.title){cam.x+=dx;cam.y+=dy;clampCam()}});
const ptrEnd=e=>{touches.delete(e.pointerId);if(touches.size<2)pinch=null};
cv.addEventListener('pointerup',e=>{ptrEnd(e);if(!ptr||e.pointerId!==ptr.id)return;const wasPan=ptr.pan;ptr=null;if(!wasPan&&MODE==='world'){worldTap(e.clientX,e.clientY);return}if(!wasPan&&GS&&MODE==='battle'&&$('dlg').classList.contains('hide'))onTap(pickTile(e.clientX,e.clientY),e.clientX,e.clientY)});
cv.addEventListener('pointercancel',e=>{ptrEnd(e);ptr=null});
function zoomAt(f,px,py){const nt=clamp(TW*f,40,150),r=nt/TW;cam.x=px-(px-cam.x)*r;cam.y=py-(py-cam.y)*r;TW=nt;TH=TW/2;HZ=TW*.3;const n=GS.cols+GS.rows;GS.bounds={minX:-GS.rows*TW/2,maxX:GS.cols*TW/2,minY:-GS.maxH*HZ-TW*1.15,maxY:n*TH/2+HZ*.6};clampCam()}
cv.addEventListener('wheel',e=>{if(MODE==='world'){e.preventDefault();zoomWorld(e.deltaY<0?1.1:1/1.1,e.clientX,e.clientY);return}if(!GS||GS.title)return;e.preventDefault();zoomAt(e.deltaY<0?1.1:1/1.1,e.clientX,e.clientY)},{passive:false});
cv.addEventListener('contextmenu',e=>e.preventDefault());

/* ---------------- loop ---------------- */
let last=performance.now();
function loop(now){const dt=Math.min(.05,(now-last)/1000);last=now;T+=dt;stepTweens(dt);if(MODE==='world')renderWorld();else render();requestAnimationFrame(loop)}
resize();makePatterns();toTitle();requestAnimationFrame(loop);
</script>
